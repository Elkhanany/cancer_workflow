<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page Not Found &middot; Cancer Management</title>
<script>
/* Seed the theme before first paint. Shares the 'cw-theme' key with the main
   site so a visitor's light/dark choice carries over. */
(function () {
  try {
    var s = localStorage.getItem('cw-theme');
    var dark = s ? s === 'dark'
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<style>
/* Self-contained on purpose: Cloudflare Pages serves this file for a missing
   path at ANY depth, so it must not reference relative assets. Every link is
   root-absolute ("/"). Tokens mirror index.html / compose.html. */
:root {
  --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
  --surface: #ffffff;
  --card-bg: rgba(255, 255, 255, 0.92);
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --border: #e2e8f0;
  --accent: #334155;
  --focus: #2563eb;
  --focus-ring: rgba(37, 99, 235, 0.35);
  --shadow: rgba(15, 23, 42, 0.10);
}
:root[data-theme="dark"] {
  --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  --surface: #111a2b;
  --card-bg: rgba(30, 41, 59, 0.92);
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --border: #334155;
  --accent: #cbd5e1;
  --focus: #60a5fa;
  --focus-ring: rgba(96, 165, 250, 0.40);
  --shadow: rgba(0, 0, 0, 0.35);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; }
body {
  font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-primary);
  min-height: 100%;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
}

.card {
  width: 100%; max-width: 460px;
  background: var(--card-bg);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 28px 24px;
  box-shadow: 0 4px 14px var(--shadow);
  text-align: center;
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .card { background: var(--surface); }
}
.logo {
  width: 48px; height: 48px; border-radius: 12px; margin: 0 auto 16px;
  background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #fff; font-size: 19px; letter-spacing: 0.5px;
}
.code {
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--text-secondary);
}
h1 { font-size: 22px; font-weight: 700; line-height: 1.2; margin: 4px 0 10px; }
p { font-size: 14px; color: var(--text-secondary); }

.btn-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
.btn {
  font-family: inherit; font-size: 14px; font-weight: 700;
  padding: 11px 16px; min-height: 44px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-primary);
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  transition: border-color 0.15s ease, transform 0.1s ease;
}
.btn:hover { border-color: var(--focus); transform: translateY(-1px); }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring); }
.btn.primary { background: var(--accent); color: var(--surface); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<main class="card">
  <div class="logo" aria-hidden="true">BC</div>
  <div class="code">Error 404</div>
  <h1>Page not found</h1>
  <p>This address is not part of the breast-cancer decision tree. The link may be out of date, or the page may have moved.</p>
  <div class="btn-row">
    <a class="btn primary" href="/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
      Go to the mind map
    </a>
  </div>
</main>

</body>
</html>
